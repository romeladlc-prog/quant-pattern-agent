name: offline-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Offline unit tests (no Alpaca/FRED credentials, network blocked)
        # Includes Phase 7: test_patterns.py, test_pattern_causality.py,
        # test_pattern_state_machine.py.
        run: python -m pytest -q
      - name: Phase 7 synthetic validation (offline, prefix causality checks)
        run: python validate_patterns.py --synthetic
      - name: Byte-compile sources and validators
        run: python -m compileall -q src tests app.py main.py validate_*.py summarize_phase4_1.py
