name: offline-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Offline unit tests (no Alpaca/FRED credentials, network blocked)
        run: python -m pytest -q
      - name: Byte-compile sources and validators
        run: python -m compileall -q src tests app.py main.py validate_*.py summarize_phase4_1.py
